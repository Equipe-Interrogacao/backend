networks:
  rede_asg:
    driver: bridge

services:
  postgres:
    container_name: postgres-container
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=asg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/backup_asg.sql:/tmp/backup_asg.sql:ro
      - ./scripts/init_restore.sh:/docker-entrypoint-initdb.d/z_restore.sh:ro
    networks:
      - rede_asg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asg_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  controller-gerenciamento-banco:
    build: ./services/gerenciamento_banco
    container_name: controller-gerenciamento-banco
    ports:
      - "8004:8000"
    env_file:
      - .env
    networks:
      - rede_asg
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  controller-ingestao:
    build: ./services/ingestao
    container_name: controller-ingestao
    ports:
      - "8001:8000"
    env_file:
      - .env
    networks:
      - rede_asg
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  controller-cruzamento-asg:
    build: ./services/cruzamento_asg
    container_name: controller-cruzamento-asg
    ports:
      - "8002:8000"
    env_file:
      - .env
    networks:
      - rede_asg
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  controller-busca-semantica:
    build: ./services/busca_semantica
    container_name: controller-busca-semantica
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      - GERENCIAMENTO_BANCO_URL=http://controller-gerenciamento-banco:8000
      - CRUZAMENTO_ASG_URL=http://controller-cruzamento-asg:8000
      - RELATORIO_ASG_URL=http://controller-cruzamento-asg:8000
    networks:
      - rede_asg
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ../frontend
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8003
    networks:
      - rede_asg
    depends_on:
      - controller-gerenciamento-banco
      - controller-ingestao
      - controller-cruzamento-asg
      - controller-busca-semantica
    restart: on-failure

volumes:
  postgres-data:
